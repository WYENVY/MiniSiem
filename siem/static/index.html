<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini SIEM</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
    header { padding: 16px 24px; background: #1e293b; font-size: 20px; font-weight: 600; }
    main { padding: 24px; max-width: 1100px; margin: auto; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
    .card { background: #1e293b; border-radius: 8px; padding: 16px; }
    .card .num { font-size: 28px; font-weight: 700; }
    .card .label { color: #94a3b8; font-size: 13px; }
    .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 16px; margin: 16px 0; }
    table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 8px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #334155; font-size: 14px; }
    .sev { color: #f87171; font-weight: 600; }
    h2 { margin-top: 28px; }
  </style>
</head>
<body>
  <header>Mini SIEM</header>
  <main>
    <div class="cards" id="cards"></div>
    <div class="charts">
      <div class="card"><canvas id="attackers"></canvas></div>
      <div class="card"><canvas id="hourly"></canvas></div>
    </div>
    <h2>Recent alerts</h2>
    <table>
      <thead><tr><th>Time</th><th>Severity</th><th>Rule</th><th>IP</th><th>Description</th></tr></thead>
      <tbody id="alerts"></tbody>
    </table>
  </main>
  <script>
    const getJSON = (url) => fetch(url).then(r => r.json());

    function cell(text, cls) {
      const td = document.createElement("td");
      td.textContent = text;           // textContent, never innerHTML: log data is untrusted
      if (cls) td.className = cls;
      return td;
    }

    async function load() {
      const [summary, alerts, attackers, hourly] = await Promise.all([
        getJSON("/api/summary"), getJSON("/api/alerts"),
        getJSON("/api/top-attackers"), getJSON("/api/failures-per-hour"),
      ]);

      const cards = document.getElementById("cards");
      cards.replaceChildren();
      for (const [label, key] of [["Events", "total_events"], ["Failed logins", "failed_logins"],
                                  ["Unique attacker IPs", "unique_ips"], ["Alerts", "alerts"]]) {
        const div = document.createElement("div");
        div.className = "card";
        const num = document.createElement("div");
        num.className = "num"; num.textContent = summary[key];
        const lab = document.createElement("div");
        lab.className = "label"; lab.textContent = label;
        div.append(num, lab);
        cards.appendChild(div);
      }

      const tbody = document.getElementById("alerts");
      tbody.replaceChildren();
      for (const a of alerts) {
        const tr = document.createElement("tr");
        tr.append(cell(a.timestamp.replace("T", " ")), cell(a.severity.toUpperCase(), "sev"),
                  cell(a.rule), cell(a.ip), cell(a.description));
        tbody.appendChild(tr);
      }

      new Chart(document.getElementById("attackers"), {
        type: "bar",
        data: { labels: attackers.map(a => a.ip),
                datasets: [{ label: "Failed attempts", data: attackers.map(a => a.failed_attempts) }] },
        options: { plugins: { title: { display: true, text: "Top attacking IPs" } } },
      });
      new Chart(document.getElementById("hourly"), {
        type: "line",
        data: { labels: hourly.map(h => h.hour.replace("T", " ") + ":00"),
                datasets: [{ label: "Failed logins", data: hourly.map(h => h.failures), tension: 0.3 }] },
        options: { plugins: { title: { display: true, text: "Failed logins per hour" } } },
      });
    }
    load();
  </script>
</body>
</html>
